<svg xmlns="http://www.w3.org/2000/svg" width="680" height="504" viewBox="0 0 680 504" role="img">
<title>Fluxo de validação de zoneamento no Órbita</title>
<desc>No fluxo do mapa, a distância é checada ao carregar o ponto e o zoneamento completo ao salvar. No Órbita IA as duas validações rodam juntas na tela final. Modais e avisos só aparecem quando há apontamento; o indicador de zoneamento verificado aparece sempre.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
.gy rect{fill:#F1EFE8;stroke:#5F5E5A}
.gy .th{fill:#2C2C2A}.gy .ts{fill:#444441}
.tl rect{fill:#E1F5EE;stroke:#0F6E56}
.tl .th{fill:#04342C}.tl .ts{fill:#0F6E56}
.am rect{fill:#FAEEDA;stroke:#854F0B}
.am .th{fill:#412402}.am .ts{fill:#854F0B}
.bl rect{fill:#E6F1FB;stroke:#185FA5}
.bl .th{fill:#042C53}.bl .ts{fill:#185FA5}
rect{stroke-width:.5}
</style>
</defs>
<rect x="0" y="0" width="680" height="504" fill="#FFFFFF"/>

<g class="gy"><rect x="50" y="40" width="250" height="44" rx="8"/>
<text class="th" x="175" y="62" text-anchor="middle" dominant-baseline="central">Fluxo do mapa</text></g>
<g class="gy"><rect x="380" y="40" width="250" height="44" rx="8"/>
<text class="th" x="505" y="62" text-anchor="middle" dominant-baseline="central">Órbita IA</text></g>

<line x1="175" y1="84" x2="175" y2="104" class="arr" marker-end="url(#a)"/>
<line x1="505" y1="84" x2="505" y2="104" class="arr" marker-end="url(#a)"/>

<g class="tl"><rect x="50" y="104" width="250" height="56" rx="8"/>
<text class="th" x="175" y="122" text-anchor="middle" dominant-baseline="central">Validação 1, ao carregar</text>
<text class="ts" x="175" y="142" text-anchor="middle" dominant-baseline="central">Só distância, 300 m</text></g>
<g class="tl"><rect x="380" y="104" width="250" height="56" rx="8"/>
<text class="th" x="505" y="122" text-anchor="middle" dominant-baseline="central">As duas validações juntas</text>
<text class="ts" x="505" y="142" text-anchor="middle" dominant-baseline="central">Distância real e grupo</text></g>

<line x1="175" y1="160" x2="175" y2="180" class="arr" marker-end="url(#a)"/>
<line x1="505" y1="160" x2="505" y2="180" class="arr" marker-end="url(#a)"/>

<g class="am"><rect x="50" y="180" width="250" height="56" rx="8"/>
<text class="th" x="175" y="198" text-anchor="middle" dominant-baseline="central">Modal, se houver algo</text>
<text class="ts" x="175" y="218" text-anchor="middle" dominant-baseline="central">Senão, não aparece</text></g>
<g class="am"><rect x="380" y="180" width="250" height="56" rx="8"/>
<text class="th" x="505" y="198" text-anchor="middle" dominant-baseline="central">Modal, se houver algo</text>
<text class="ts" x="505" y="218" text-anchor="middle" dominant-baseline="central">Senão, não aparece</text></g>

<line x1="175" y1="236" x2="175" y2="256" class="arr" marker-end="url(#a)"/>

<g class="tl"><rect x="50" y="256" width="250" height="56" rx="8"/>
<text class="th" x="175" y="274" text-anchor="middle" dominant-baseline="central">Validação 2, ao salvar</text>
<text class="ts" x="175" y="294" text-anchor="middle" dominant-baseline="central">Grupo e distância 300/500 m</text></g>

<line x1="175" y1="312" x2="175" y2="332" class="arr" marker-end="url(#a)"/>

<g class="am"><rect x="50" y="332" width="250" height="56" rx="8"/>
<text class="th" x="175" y="350" text-anchor="middle" dominant-baseline="central">Aviso, se houver algo</text>
<text class="ts" x="175" y="370" text-anchor="middle" dominant-baseline="central">Senão, salva sem aviso</text></g>

<path d="M175 388 V404 H286 V414" class="arr" marker-end="url(#a)"/>
<path d="M505 236 V404 H394 V414" class="arr" marker-end="url(#a)"/>

<g class="gy"><rect x="170" y="420" width="340" height="44" rx="8"/>
<text class="th" x="340" y="442" text-anchor="middle" dominant-baseline="central">Análise salva, veredito registrado</text></g>
</svg>
